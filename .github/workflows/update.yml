name: Update

on:
  workflow_dispatch: {}
  schedule:
    # Daily at 00:00 America/Los_Angeles (PST/PDT) ≈ 08:00 UTC
    - cron: '0 8 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-z:
    name: Update z utility
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install tooling
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Gather latest release info and compute checksums
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        echo "Fetching latest Binutils release..."
        BIN_JSON=$(curl -s -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/nanvix/binutils/releases/latest)
        BIN_TAG=$(echo "$BIN_JSON" | jq -r '.tag_name')
        # Extract version and short hash from tag_name (expecting nanvix-v<version>-<shorthash>)
        BIN_SUFFIX=${BIN_TAG#nanvix-v}
        BIN_VERSION=${BIN_SUFFIX%-*}
        BIN_HASH=${BIN_SUFFIX##*-}

        BIN_ASSET_URL=$(echo "$BIN_JSON" | jq -r '.assets[]? | select(.name | test("nanvix-binutils-.*\\.tar\\.bz2")) | .browser_download_url' || true)
        if [ -z "$BIN_ASSET_URL" ] || [ "$BIN_ASSET_URL" = "null" ]; then
          BIN_ASSET_URL="https://github.com/nanvix/binutils/releases/download/${BIN_TAG}/nanvix-binutils-${BIN_VERSION}-${BIN_HASH}.tar.bz2"
        fi

        echo "Binutils tag=$BIN_TAG"
        echo "Binutils version=$BIN_VERSION"
        echo "Binutils short hash=$BIN_HASH"
        echo "Binutils asset url=$BIN_ASSET_URL"

        echo "Downloading Binutils asset to compute checksum..."
        curl -sL -o /tmp/nanvix-binutils.tar.bz2 "$BIN_ASSET_URL"
        BIN_SHA=$(sha256sum /tmp/nanvix-binutils.tar.bz2 | awk '{print $1}')
        BIN_SHA_FMT="sha256:${BIN_SHA}"
        echo "Binutils sha256=$BIN_SHA_FMT"

        echo "BIN_TAG=$BIN_TAG" >> $GITHUB_ENV
        echo "BIN_VERSION=$BIN_VERSION" >> $GITHUB_ENV
        echo "BIN_HASH=$BIN_HASH" >> $GITHUB_ENV
        echo "BIN_ASSET_URL=$BIN_ASSET_URL" >> $GITHUB_ENV
        echo "BIN_SHA_FMT=$BIN_SHA_FMT" >> $GITHUB_ENV

        echo "\nFetching latest Newlib release..."
        NEW_JSON=$(curl -s -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/nanvix/newlib/releases/latest)
        NEW_TAG=$(echo "$NEW_JSON" | jq -r '.tag_name')
        NEW_SUFFIX=${NEW_TAG#nanvix-v}
        NEW_VERSION=${NEW_SUFFIX%-*}
        NEW_HASH=${NEW_SUFFIX##*-}

        NEW_ASSET_URL=$(echo "$NEW_JSON" | jq -r '.assets[]? | select(.name | test("nanvix-newlib-.*\\.tar\\.bz2")) | .browser_download_url' || true)
        if [ -z "$NEW_ASSET_URL" ] || [ "$NEW_ASSET_URL" = "null" ]; then
          NEW_ASSET_URL="https://github.com/nanvix/newlib/releases/download/${NEW_TAG}/nanvix-newlib-${NEW_VERSION}-${NEW_HASH}.tar.bz2"
        fi

        echo "Newlib tag=$NEW_TAG"
        echo "Newlib version=$NEW_VERSION"
        echo "Newlib short hash=$NEW_HASH"
        echo "Newlib asset url=$NEW_ASSET_URL"

        echo "Downloading Newlib asset to compute checksum..."
        curl -sL -o /tmp/nanvix-newlib.tar.bz2 "$NEW_ASSET_URL"
        NEW_SHA=$(sha256sum /tmp/nanvix-newlib.tar.bz2 | awk '{print $1}')
        NEW_SHA_FMT="sha256:${NEW_SHA}"
        echo "Newlib sha256=$NEW_SHA_FMT"

        echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
        echo "NEW_HASH=$NEW_HASH" >> $GITHUB_ENV
        echo "NEW_ASSET_URL=$NEW_ASSET_URL" >> $GITHUB_ENV
        echo "NEW_SHA_FMT=$NEW_SHA_FMT" >> $GITHUB_ENV

    - name: Check for changes and update z
      env:
        BIN_VERSION: ${{ env.BIN_VERSION }}
        BIN_HASH: ${{ env.BIN_HASH }}
        BIN_SHA_FMT: ${{ env.BIN_SHA_FMT }}
        NEW_VERSION: ${{ env.NEW_VERSION }}
        NEW_HASH: ${{ env.NEW_HASH }}
        NEW_SHA_FMT: ${{ env.NEW_SHA_FMT }}
      run: |
        set -euo pipefail

        # Read current values from z script
        CUR_BIN_VER=$(grep -oP '^readonly BINUTILS_VERSION="\K[^"]+' z || true)
        CUR_BIN_HASH=$(grep -oP '^readonly BINUTILS_SHORT_COMMIT_HASH="\K[^"]+' z || true)
        CUR_NEW_VER=$(grep -oP '^readonly NEWLIB_VERSION="\K[^"]+' z || true)
        CUR_NEW_HASH=$(grep -oP '^readonly NEWLIB_SHORT_COMMIT_HASH="\K[^"]+' z || true)

        echo "Current z/binutils: version=$CUR_BIN_VER hash=$CUR_BIN_HASH"
        echo "Latest binutils: version=$BIN_VERSION hash=$BIN_HASH"
        echo "Current z/newlib: version=$CUR_NEW_VER hash=$CUR_NEW_HASH"
        echo "Latest newlib: version=$NEW_VERSION hash=$NEW_HASH"

        CHANGED=false
        if [ "$CUR_BIN_HASH" != "$BIN_HASH" ]; then
          echo "Binutils update detected"
          CHANGED=true
        fi
        if [ "$CUR_NEW_HASH" != "$NEW_HASH" ]; then
          echo "Newlib update detected"
          CHANGED=true
        fi

        if [ "$CHANGED" = false ]; then
          echo "No updates detected. Exiting."
          exit 0
        fi

        # Create branch name
        BRANCH_NAME="update/z-binutils-${BIN_VERSION}-${BIN_HASH}-newlib-${NEW_VERSION}-${NEW_HASH}-$(date +%Y%m%d)"
        echo "Creating branch: $BRANCH_NAME"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -b "$BRANCH_NAME"

        # Update only short commit hashes and sha256 checksums in z script
        # Do NOT change VERSION or URL fields.
        sed -E -i "s/^(readonly BINUTILS_SHORT_COMMIT_HASH=).*/\1\"${BIN_HASH}\"/" z
        sed -E -i "s@^(readonly BINUTILS_SHA256_CHECKSUM=).*@\1\"${BIN_SHA_FMT}\"@" z

        sed -E -i "s/^(readonly NEWLIB_SHORT_COMMIT_HASH=).*/\1\"${NEW_HASH}\"/" z
        sed -E -i "s@^(readonly NEWLIB_SHA256_CHECKSUM=).*@\1\"${NEW_SHA_FMT}\"@" z

        git add z
        git commit -m "ci: update z utility short commit hashes and sha256 checksums: binutils ${BIN_HASH}, newlib ${NEW_HASH}"
        git push -u origin "$BRANCH_NAME"

        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

    - name: Create pull request
      uses: actions/github-script@v7
      with:
        script: |
          const branch = process.env.BRANCH_NAME
          if (!branch) {
            core.info('No branch created; nothing to do.')
            return
          }

          const title = `ci: update z to binutils ${process.env.BIN_VERSION}-${process.env.BIN_HASH} and newlib ${process.env.NEW_VERSION}-${process.env.NEW_HASH}`
          const body = `Automated update of the \`z\` helper script to reference the latest released artifacts.\n\n- Binutils: ${process.env.BIN_TAG} (sha256: ${process.env.BIN_SHA_FMT})\n- Newlib: ${process.env.NEW_TAG} (sha256: ${process.env.NEW_SHA_FMT})\n\nThis change was generated by the update workflow.`

          await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            head: branch,
            base: 'dev',
            body: body
          })
      env:
        BRANCH_NAME: ${{ env.BRANCH_NAME }}
        BIN_VERSION: ${{ env.BIN_VERSION }}
        BIN_HASH: ${{ env.BIN_HASH }}
        BIN_TAG: ${{ env.BIN_TAG }}
        BIN_SHA_FMT: ${{ env.BIN_SHA_FMT }}
        NEW_VERSION: ${{ env.NEW_VERSION }}
        NEW_HASH: ${{ env.NEW_HASH }}
        NEW_TAG: ${{ env.NEW_TAG }}
        NEW_SHA_FMT: ${{ env.NEW_SHA_FMT }}
